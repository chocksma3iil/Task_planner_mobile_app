services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: task_planner
      MYSQL_USER: task_planner
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://task_planner:${MYSQL_PASSWORD}@mysql:3306/task_planner?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://task_planner:${MYSQL_PASSWORD}@mysql:3306/task_planner_test?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      TOKEN_TTL_DAYS: "30"
      ENVIRONMENT: development
      CORS_ORIGINS: "*"
      CREATE_SCHEMA_ON_STARTUP: "false"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
    ports:
      - "${PHPMYADMIN_BIND:-127.0.0.1}:${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
